name: Bake morning edition

on:
  schedule:
    - cron: "0 0 * * *"   # 05:30 IST daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run contract tests
        run: python -m pytest tests/ -q

      - name: Bake edition
        env:
          NEWSMESH_API_KEY: ${{ secrets.NEWSMESH_API_KEY }}
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
        run: python -m baker

      - name: Publish
        run: |
          git config user.name "sheaf-baker"
          git config user.email "actions@users.noreply.github.com"
          git add editions/
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "Edition $(date -u +%F)"
          git push
